; tTime default settings
;
; This file is installed next to tTime.exe and provides the defaults.
; tTime never writes to it. Your own settings live in %APPDATA%\tTime\tTime.ini
; and override anything set here (for all users of this installation, edit this file;
; for just yourself, copy a setting into your own file).
;
; Comments must be on their own line: text after a value is part of the value.

[appearance]
; Font of the countdown time: oxanium, jura, doto, outfit or sansation
countdown-font=oxanium

; Weight of the countdown font: 100-900, or a name:
; thin, extralight, light, regular, medium, semibold, bold, extrabold, black.
; Values outside the font's range are clamped
; (oxanium 200-800, jura 300-700, doto 100-900, outfit 100-900, sansation 300-400).
countdown-weight=400

; Font and weight of the alarm message, below the countdown and in the "Time's up"
; window (same choices as above)
message-font=outfit
message-weight=300

; Font sizes in points (6-96): the countdown, the message below it, and the
; message in the "Time's up" window. Larger sizes may need a larger countdown window.
countdown-size=18
message-size=14
time-up-message-size=20

; Theme of the tTime windows and icon: blue, sage (sage green), prussian-blue, hibiscus-red,
; jade-green, forest-green, pine-green or hunter-green
theme=blue

; Animations of the "Time's up" window (swaying tree, ringing tray icon): on or off
animations=on

[progress-dialog]
; Size and position of the countdown window when tTime has not remembered one yet.
; Moving or resizing the window yourself saves your choice in %APPDATA%\tTime\tTime.ini.
size=@Size(200 95)
pos=@Point(250 250)
