[package]
name = "ttime"
version = "1.1.0"
edition = "2024"
description = "Countdown alarms (\"tea timer\") that live in the system tray"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "tTime"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tray-icon = "0.26"
rodio = { version = "0.23", default-features = false, features = ["playback", "wav"] }
regex = "1"
raw-window-handle = "0.6"
futures = "0.3"
log = "0.4"
anyhow = "1"
unicode-segmentation = "1"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
