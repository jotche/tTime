# Release packages: a ZIP for Windows x64 and a DMG for macOS on Apple silicon (arm64).
#
# Run it by hand (Actions -> Release -> Run workflow) to get the packages as workflow
# artifacts, or push a version tag (git tag v1.0.0 && git push origin v1.0.0) to also
# attach them to a GitHub release for that tag.
#
# Qt 6.8 LTS is used because install-qt-action (aqtinstall) cannot install Qt 6.12 yet;
# see ci.yml. The macOS app is signed ad hoc only (no Apple developer certificate), so
# Gatekeeper asks before the first start - see README.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  QT_VERSION: "6.8.3"

jobs:
  windows:
    name: Windows x64 (ZIP)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          modules: qtmultimedia
          tools: tools_mingw1310
          add-tools-to-path: true
          cache: true
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_CXX_COMPILER=g++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target package
      - uses: actions/upload-artifact@v4
        with:
          name: tTime-windows-x64
          path: build/packages/*.zip
          if-no-files-found: error

  macos:
    name: macOS arm64 (DMG)
    runs-on: macos-15 # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtmultimedia
          cache: true
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        run: cmake --build build
      - name: Test (offscreen)
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: cmake --build build --target package
      - name: Check the bundle
        run: |
          hdiutil attach build/packages/*.dmg -mountpoint /tmp/ttime -nobrowse
          ls -la /tmp/ttime /tmp/ttime/tTime.app/Contents/Resources
          codesign --verify --deep --strict /tmp/ttime/tTime.app
          lipo -archs /tmp/ttime/tTime.app/Contents/MacOS/tTime
          hdiutil detach /tmp/ttime
      - uses: actions/upload-artifact@v4
        with:
          name: tTime-macos-arm64
          path: build/packages/*.dmg
          if-no-files-found: error

  publish:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" packages/*
          --repo "$GITHUB_REPOSITORY" --title "tTime ${GITHUB_REF_NAME#v}" --generate-notes
